[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-kythuat-baxter"
version = "0.1.0"
description = "CPU-first technical RAG chatbot for Baxter IC service manuals."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.100",
  "pydantic>=2",
  "pypdf>=5",
  "requests>=2",
  "uvicorn>=0.20",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]

[project.scripts]
baxter-rag = "baxter_rag.cli:main"

[tool.setuptools.package-data]
baxter_rag = ["static/*"]

